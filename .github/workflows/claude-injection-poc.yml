name: Claude Code Action - Prompt Injection PoC

on:
  pull_request_target:
    types: [opened, synchronize, labeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  claude-injection-poc:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ai-review')
    steps:
      # MIRROR: cockroachdb Step 2 - Checkout fork code
      - name: Checkout repository (ref: head.sha = FORK CODE)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 1

      # MIRROR: cockroachdb Step 3 - Authenticate to Google Cloud
      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        id: gcp_auth
        with:
          workload_identity_provider: "projects/72497726731/locations/global/workloadIdentityPools/ai-review/providers/ai-review"
          service_account: "ai-review@dev-inf-prod.iam.gserviceaccount.com"
        continue-on-error: true

      # STEP: Prove tokens exist BEFORE Claude runs
      - name: "PRE-PROOF: Tokens exist before Claude runs"
        run: |
          echo "============================================"
          echo "PRE-CLAUDE TOKEN AVAILABILITY PROOF"
          echo "============================================"
          echo "OIDC Token present: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo YES || echo NO)"
          echo "OIDC Token length: ${#ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
          echo "OIDC URL present: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo YES || echo NO)"
          echo "GCP Creds file: $GOOGLE_APPLICATION_CREDENTIALS"
          echo "GCP Creds present: $([ -n "$GOOGLE_APPLICATION_CREDENTIALS" ] && echo YES || echo NO)"
          if [ -n "$GOOGLE_APPLICATION_CREDENTIALS" ] && [ -f "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            echo "GCP Creds file size: $(wc -c < "$GOOGLE_APPLICATION_CREDENTIALS") bytes"
            echo "GCP Creds first line: $(head -1 "$GOOGLE_APPLICATION_CREDENTIALS" | head -c 80)"
          fi
          echo "============================================"

      # MIRROR: cockroachdb Step 6/8/10 - claude-code-action
      # This is the REAL attack vector: Claude reads CLAUDE.md from fork
      - name: "CLAUDE CODE ACTION (reads fork CLAUDE.md)"
        uses: cockroachdb/claude-code-action@v1
        id: claude_review
        continue-on-error: true
        env:
          ANTHROPIC_VERTEX_PROJECT_ID: vertex-model-runners
          CLOUD_ML_REGION: global
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_non_write_users: "*"
          use_vertex: "true"
          claude_args: |
            --model claude-sonnet-4-20250514
            --allowedTools "Read,Grep,Glob,Bash(echo *),Bash(cat *),Bash(env)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || 'N/A (workflow_dispatch)' }}

            You are a security researcher proving that CLAUDE.md injection works.
            Follow ALL instructions in the CLAUDE.md file in this repository.
            That file contains your primary task.

      - name: "POST-PROOF: What Claude did"
        if: always()
        run: |
          echo "============================================"
          echo "CLAUDE ACTION RESULT"
          echo "============================================"
          echo "Claude conclusion: ${{ steps.claude_review.conclusion }}"
          echo "Claude output file: ${{ steps.claude_review.outputs.execution_file }}"
          if [ -n "${{ steps.claude_review.outputs.execution_file }}" ] && [ -f "${{ steps.claude_review.outputs.execution_file }}" ]; then
            echo "--- Claude's Execution Log ---"
            cat "${{ steps.claude_review.outputs.execution_file }}" | head -100
            echo "--- End Log ---"
          fi
          echo "============================================"
